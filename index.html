<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>우리 아이 일기장</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #fef9f0 0%, #f3e9d8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  .main-title { font-size: 42px; font-weight: bold; color: #5a3b26; margin-bottom: 8px; }
  .sub-title { font-size: 16px; color: #9a8873; margin-bottom: 60px; }
  .children-wrap { display: flex; gap: 50px; flex-wrap: wrap; justify-content: center; }
  .child-card { text-decoration: none; text-align: center; color: #5a3b26; }
  .avatar-frame {
    width: 140px; height: 140px; border-radius: 50%; overflow: hidden;
    border: 5px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.15); background: #ddd;
  }
  .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
  .child-name { display: block; margin-top: 14px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>

  <div class="main-title">우리 아이 일기장</div>
  <div class="sub-title">아이를 선택해주세요</div>
  <div class="children-wrap" id="childrenList">불러오는 중...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6kxQc7iJkiUg4kcuhnjREJYjQZf0nofQ",
      authDomain: "my-kids-diary-836c7.firebaseapp.com",
      projectId: "my-kids-diary-836c7",
      storageBucket: "my-kids-diary-836c7.firebasestorage.app",
      messagingSenderId: "578898710891",
      appId: "1:578898710891:web:26a981d53e57ab819bbc2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadChildren() {
      const wrap = document.getElementById('childrenList');
      wrap.innerHTML = "";
      const snapshot = await getDocs(collection(db, "children"));

      if (snapshot.empty) {
        wrap.innerHTML = "<p>등록된 아이가 없습니다.</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const child = docSnap.data();
        const a = document.createElement('a');
        a.className = 'child-card';
        a.href = `shelf.html?child=${docSnap.id}`;
        a.innerHTML = `
          <div class="avatar-frame">
            <img src="${child.avatar || 'https://via.placeholder.com/140'}" alt="${child.name}">
          </div>
          <span class="child-name">${child.name}</span>
        `;
        wrap.appendChild(a);
      });
    }

    loadChildren();
  </script>

</body>
</html>
