<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재윤이의 성장일기</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #3a3a3a; overflow: hidden; }
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; background: rgba(0,0,0,0.55); color: #fff; z-index: 100;
  }
  .top-bar a { color: #fff; text-decoration: none; font-size: 14px; font-weight: bold; }
  .flip-wrap {
    position: fixed; top: 56px; bottom: 100px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
    background: rgba(0,0,0,0.6); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; z-index: 100;
  }
  .page-slider { width: 70%; }
  .page-indicator { color: #fff; font-size: 13px; }
</style>
</head>
<body>

  <div class="top-bar">
    <a href="shelf.html">&lt; 책장으로 돌아가기</a>
    <div>재윤이의 성장일기</div>
  </div>

  <div class="flip-wrap">
    <div id="flipbook"></div>
  </div>

  <div class="bottom-bar">
    <input type="range" class="page-slider" id="pageSlider" min="1" value="1">
    <div class="page-indicator" id="pageIndicator">1 / 139</div>
  </div>

<script>
  // 👉 완성된 이미지 139장을 그냥 순서대로 나열만 함 (디자인 작업 없음!)
  const TOTAL_PAGES = 139; // 실제 페이지 수에 맞게 수정
  const pageImages = [];
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const p = String(i).padStart(3, '0');
    pageImages.push(`pages/vol12/page${p}.jpg`); // 실제 이미지 폴더/파일명 규칙에 맞게 수정
  }

  const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
    width: 500,
    height: 650,
    size: 'stretch',
    minWidth: 280, maxWidth: 900,
    minHeight: 380, maxHeight: 1100,
    showCover: true,     // 첫 장(표지)이 단독으로 중앙에 보임
    usePortrait: true,   // PC는 양면, 모바일은 1페이지
    maxShadowOpacity: 0.5
  });

  pageFlip.loadFromImages(pageImages);

  const slider = document.getElementById('pageSlider');
  slider.max = TOTAL_PAGES;
  const indicator = document.getElementById('pageIndicator');

  function updateIndicator() {
    const current = pageFlip.getCurrentPageIndex() + 1;
    indicator.textContent = `${current} / ${TOTAL_PAGES}`;
    slider.value = current;
  }
  pageFlip.on('flip', updateIndicator);
  updateIndicator();

  slider.addEventListener('input', () => {
    pageFlip.flip(Number(slider.value) - 1);
  });
</script>

</body>
</html>
