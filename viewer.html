<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재윤이의 성장일기</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2b2b2b; font-family: "Malgun Gothic", sans-serif; overflow: hidden; }

  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; background: rgba(0,0,0,0.55); color: #fff; z-index: 100;
  }
  .top-bar a { color: #fff; text-decoration: none; font-size: 14px; font-weight: bold; }

  .music-bar {
    position: fixed; top: 64px; right: 16px; z-index: 110;
    background: rgba(0,0,0,0.6); border-radius: 30px;
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: #fff;
  }
  .music-bar button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
  .music-title { font-size: 12px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .flip-wrap {
    position: fixed; top: 56px; bottom: 60px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .flip-viewport {
    position: relative;
    overflow: hidden;
    transition: width 0.3s ease;
  }
  .flip-stage {
    position: absolute;
    top: 0;
    height: 100%;
    transition: left 0.3s ease;
  }
  #flipbook { width: 100% !important; height: 100% !important; touch-action: pan-y; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    display: flex; align-items: center; justify-content: center;
    gap: 16px; background: rgba(0,0,0,0.55); z-index: 100;
  }
  .nav-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .nav-btn:hover { background: rgba(255,255,255,0.3); }
  .page-indicator { color: #fff; font-size: 13px; min-width: 70px; text-align: center; flex-shrink: 0; }
  .page-slider { width: 40%; }

  .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; background: #2b2b2b; z-index: 200; }
</style>
</head>
<body>

  <div class="top-bar">
    <a id="backLink" href="shelf.html">&lt; 책장으로 돌아가기</a>
    <div class="book-title" id="bookTitle">불러오는 중...</div>
  </div>

  <div class="music-bar">
    <button id="playPauseBtn">▶</button>
    <span class="music-title" id="musicTitle">배경음악</span>
  </div>
  <audio id="bgmPlayer" loop></audio>

  <div class="flip-wrap">
    <div class="flip-viewport" id="flipViewport">
      <div class="flip-stage" id="flipStage">
        <div id="flipbook"></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="nav-btn" id="prevBtn">‹</button>
    <input type="range" class="page-slider" id="pageSlider" min="1" value="1">
    <div class="page-indicator" id="pageIndicator">- / -</div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>

  <div class="loading" id="loadingMsg">페이지를 불러오는 중입니다...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB6kxQc7iJkiUg4kcuhnjREJYjQZf0nofQ",
    authDomain: "my-kids-diary-836c7.firebaseapp.com",
    projectId: "my-kids-diary-836c7",
    storageBucket: "my-kids-diary-836c7.firebasestorage.app",
    messagingSenderId: "578898710891",
    appId: "1:578898710891:web:26a981d53e57ab819bbc2e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const R2_BASE_URL = "https://pub-f6d822e0d6204700a6988d82ac3533c1.r2.dev";
  const MAX_CHECK = 50;

  const params = new URLSearchParams(window.location.search);
  const childId = params.get('child');
  const bookId  = params.get('book');

  const IMAGE_FOLDER = R2_BASE_URL + "/Pages/" + childId + "/vol" + bookId;
  const BGM_PATH = R2_BASE_URL + "/music/" + childId + "/vol" + bookId + "_bgm.mp3";

  if (!childId || !bookId) {
    document.getElementById('loadingMsg').textContent = '잘못된 접근입니다. 책장에서 다시 선택해주세요.';
  } else {
    init();
  }

  function checkImageExists(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

async function detectTotalPages(folderUrl) {
  const checks = [];
  for (let i = 1; i <= MAX_CHECK; i++) {
    const url = folderUrl + "/pages (" + i + ").jpg";
    checks.push(checkImageExists(url));
  }
  const results = await Promise.all(checks); // 모두 동시에 확인

  let count = 0;
  for (let i = 0; i < results.length; i++) {
    if (results[i]) {
      count = i + 1;
    } else {
      break; // 중간에 없는 게 나오면 멈춤 (연속된 파일 가정)
    }
  }
  return count;
}
  async function init() {
    let childName = childId;
    try {
      const docSnap = await getDoc(doc(db, "children", childId));
      if (docSnap.exists()) childName = docSnap.data().name;
    } catch (e) {}

    document.getElementById('bookTitle').textContent = childName + " - 제 " + Number(bookId) + "권";
    document.getElementById('backLink').href = "shelf.html?child=" + childId;

    const TOTAL_PAGES = await detectTotalPages(IMAGE_FOLDER);

    if (TOTAL_PAGES === 0) {
      document.getElementById('loadingMsg').textContent = '이미지를 찾을 수 없습니다. 경로를 확인해주세요.';
      return;
    }

    const pageImages = [];
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      pageImages.push(IMAGE_FOLDER + "/pages (" + i + ").jpg");
    }

    const SPREAD_RATIO = 1040 / 735;
    const wrap = document.querySelector('.flip-wrap');
    const viewport = document.getElementById('flipViewport');
    const stage = document.getElementById('flipStage');

    function computeStageSize() {
      const wrapH = wrap.clientHeight;
      const wrapW = wrap.clientWidth;
      let h = wrapH;
      let w = h * SPREAD_RATIO;
      if (w > wrapW) { w = wrapW; h = w / SPREAD_RATIO; }
      stage.style.width = w + 'px';
      stage.style.height = h + 'px';
      return { w, h };
    }

    let stageSize = computeStageSize();
    let stageW = stageSize.w;
    let stageH = stageSize.h;
    viewport.style.height = stageH + 'px';

    const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
      width: 520,
      height: 735,
      size: 'stretch',
      minWidth: 260, maxWidth: 1600,
      minHeight: 368, maxHeight: 2200,
      showCover: true,
      usePortrait: true,
      maxShadowOpacity: 0.5,
      startPage: 0
    });

    pageFlip.loadFromImages(pageImages);
    document.getElementById('loadingMsg').style.display = 'none';

    const slider = document.getElementById('pageSlider');
    slider.max = TOTAL_PAGES;

    function getSingleMode(currentIndex) {
      if (currentIndex === 0) return 'cover';
      const remainingAfterCover = TOTAL_PAGES - 1;
      const isLastAlone = (currentIndex === TOTAL_PAGES - 1) && (remainingAfterCover % 2 === 1);
      if (isLastAlone) return 'last';
      return null;
    }

    function updateViewport() {
      const current = pageFlip.getCurrentPageIndex();
      const mode = getSingleMode(current);
      if (mode === 'cover') {
        viewport.style.width = (stageW / 2) + 'px';
        stage.style.left = (-stageW / 2) + 'px';
      } else if (mode === 'last') {
        viewport.style.width = (stageW / 2) + 'px';
        stage.style.left = '0px';
      } else {
        viewport.style.width = stageW + 'px';
        stage.style.left = '0px';
      }
    }

    function updateIndicator() {
      const current = pageFlip.getCurrentPageIndex();
      const mode = getSingleMode(current);
      let label;
      if (mode === 'cover') {
        label = "1";
      } else if (mode === 'last') {
        label = String(TOTAL_PAGES);
      } else {
        const left = current + 1;
        const right = current + 2;
        label = left + "-" + right;
      }
      document.getElementById('pageIndicator').textContent = label + " / " + TOTAL_PAGES;
      slider.value = current + 1;
    }

    pageFlip.on('flip', () => {
      console.log('현재 인덱스:', pageFlip.getCurrentPageIndex(), '전체 페이지:', TOTAL_PAGES);
      updateIndicator();
      updateViewport();
    });

    updateIndicator();
    updateViewport();

    window.addEventListener('resize', () => {
      const size = computeStageSize();
      stageW = size.w; stageH = size.h;
      viewport.style.height = stageH + 'px';
      updateViewport();
    });

    document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());
    slider.addEventListener('input', () => pageFlip.flip(Number(slider.value) - 1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') pageFlip.flipNext();
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
    });

    const bgm = document.getElementById('bgmPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    bgm.src = BGM_PATH;
    document.getElementById('musicTitle').textContent = "제 " + Number(bookId) + "권 배경음악";
    playPauseBtn.addEventListener('click', () => {
      if (bgm.paused) { bgm.play().catch(() => {}); playPauseBtn.textContent = '⏸'; }
      else { bgm.pause(); playPauseBtn.textContent = '▶'; }
    });
  }
</script>

</body>
</html>
