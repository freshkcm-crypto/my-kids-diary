<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재윤이의 성장일기</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #2b2b2b;
    font-family: "Malgun Gothic", sans-serif;
    overflow: hidden;
  }

  /* ===== 상단 바 ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; background: rgba(0,0,0,0.55); color: #fff; z-index: 100;
  }
  .top-bar a { color: #fff; text-decoration: none; font-size: 14px; font-weight: bold; }
  .top-bar a:hover { text-decoration: underline; }
  .book-title { font-size: 15px; font-weight: bold; }

  /* ===== BGM 컨트롤 패널 ===== */
  .music-bar {
    position: fixed; top: 64px; right: 16px; z-index: 110;
    background: rgba(0,0,0,0.6); border-radius: 30px;
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: #fff;
  }
  .music-bar button {
    background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;
  }
  .music-title { font-size: 12px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== 플립북 영역: 화면 크기에 맞춰 꽉 차게(플렉시블) ===== */
  .flip-wrap {
    position: fixed;
    top: 56px; bottom: 60px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
 
  /* ===== 핵심 수정: 비율을 고정하는 래퍼 ===== */
  .flip-ratio-box {
    /* 520:735 비율을 그대로 유지 (가로 1 기준 세로 1.4135...) */
    aspect-ratio: 520 / 735;
    height: 100%;
    max-width: 100%;
    margin: 0 auto;
  } 
 
 #flipbook { touch-action: pan-y; }

  /* ===== 하단 바 ===== */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    display: flex; align-items: center; justify-content: center;
    gap: 24px; background: rgba(0,0,0,0.55); z-index: 100;
  }
  .nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.15);
    color: #fff; font-size: 20px; cursor: pointer;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.3); }
  .page-indicator { color: #fff; font-size: 14px; min-width: 90px; text-align: center; }

  .loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; background: #2b2b2b; z-index: 200;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <a id="backLink" href="shelf.html">&lt; 책장으로 돌아가기</a>
    <div class="book-title" id="bookTitle">불러오는 중...</div>
  </div>

  <!-- BGM 컨트롤 -->
  <div class="music-bar">
    <button id="playPauseBtn">▶</button>
    <span class="music-title" id="musicTitle">배경음악</span>
  </div>
  <audio id="bgmPlayer" loop></audio>

<!-- HTML 구조 수정 -->
<div class="flip-wrap">
  <div class="flip-ratio-box">
    <div id="flipbook"></div>
  </div>
</div>

  <div class="bottom-bar">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="page-indicator" id="pageIndicator">- / -</div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>

  <div class="loading" id="loadingMsg">페이지를 불러오는 중입니다...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } 
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB6kxQc7iJkiUg4kcuhnjREJYjQZf0nofQ",
    authDomain: "my-kids-diary-836c7.firebaseapp.com",
    projectId: "my-kids-diary-836c7",
    storageBucket: "my-kids-diary-836c7.firebasestorage.app",
    messagingSenderId: "578898710891",
    appId: "1:578898710891:web:26a981d53e57ab819bbc2e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const TOTAL_PAGES = 139; // 실제 페이지 수에 맞게 수정
  const params = new URLSearchParams(window.location.search);
  const childId = params.get('child');
  const bookId  = params.get('book');

  if (!childId || !bookId) {
    document.getElementById('loadingMsg').textContent = '잘못된 접근입니다. 책장에서 다시 선택해주세요.';
  } else {
    init();
  }

  async function init() {
    const docRef = doc(db, "children", childId);
    const docSnap = await getDoc(docRef);
    const childName = docSnap.exists() ? docSnap.data().name : childId;

    document.getElementById('bookTitle').textContent = `${childName} - 제 ${Number(bookId)}권`;
    document.getElementById('backLink').href = `shelf.html?child=${childId}`;

    // 이미지 경로: 완성된 이미지(디자인 포함)를 순서대로 불러오기
    const pageImages = [];
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const p = String(i).padStart(3, '0');
      pageImages.push(`pages/${childId}/vol${bookId}/page${p}.jpg`);
    }

    // ===== 핵심: 항상 처음(1페이지, 표지)부터 시작 =====
    const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
      // 참고 스크린샷 비율(A4/A5에 가까운 세로형, 약 0.7:1)에 맞춘 기준 사이즈
      width: 520,
      height: 735,
      size: 'stretch',           // 화면 크기에 맞춰 유연하게 커지고 작아짐
      minWidth: 260,
      maxWidth: 1100,
      minHeight: 368,
      maxHeight: 1556,
      showCover: true,           // 표지는 단독 페이지로 중앙에 보임
      usePortrait: true,         // PC: 양면 펼침 / 모바일: 1페이지
      maxShadowOpacity: 0.5,
      startPage: 0               // ★ 항상 1페이지부터 시작
    });

    pageFlip.loadFromImages(pageImages);

    document.getElementById('loadingMsg').style.display = 'none';
    updateIndicator(pageFlip);

    pageFlip.on('flip', () => updateIndicator(pageFlip));

    document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') pageFlip.flipNext();
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
    });

    function updateIndicator(flip) {
      const current = flip.getCurrentPageIndex() + 1;
      document.getElementById('pageIndicator').textContent = `${current} / ${TOTAL_PAGES}`;
    }

    // ===== BGM: 책마다 다른 음악 자동 연결 =====
    const bgm = document.getElementById('bgmPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const musicTitle = document.getElementById('musicTitle');

    bgm.src = `music/${childId}/vol${bookId}_bgm.mp3`;
    musicTitle.textContent = `제 ${Number(bookId)}권 배경음악`;

    playPauseBtn.addEventListener('click', () => {
      if (bgm.paused) {
        bgm.play();
        playPauseBtn.textContent = '⏸';
      } else {
        bgm.pause();
        playPauseBtn.textContent = '▶';
      }
    });
  }
</script>

</body>
</html>
