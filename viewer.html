<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB6kxQc7iJkiUg4kcuhnjREJYjQZf0nofQ",
    authDomain: "my-kids-diary-836c7.firebaseapp.com",
    projectId: "my-kids-diary-836c7",
    storageBucket: "my-kids-diary-836c7.firebasestorage.app",
    messagingSenderId: "578898710891",
    appId: "1:578898710891:web:26a981d53e57ab819bbc2e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const R2_BASE_URL = "https://pub-f6d822e0d6204700a6988d82ac3533c1.r2.dev";
  const MAX_CHECK = 50;

  const params = new URLSearchParams(window.location.search);
  const childId = params.get('child');
  const bookId  = params.get('book');

  // childId, bookId 선언 이후에 동적으로 생성
  const IMAGE_FOLDER = R2_BASE_URL + "/Pages/" + childId + "/vol" + bookId;
  const BGM_PATH = R2_BASE_URL + "/music/" + childId + "/vol" + bookId + "_bgm.mp3";

  if (!childId || !bookId) {
    document.getElementById('loadingMsg').textContent = '잘못된 접근입니다. 책장에서 다시 선택해주세요.';
  } else {
    init();
  }

  function checkImageExists(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  async function detectTotalPages(folderUrl) {
    let count = 0;
    for (let i = 1; i <= MAX_CHECK; i++) {
      const url = folderUrl + "/pages (" + i + ").jpg";
      const exists = await checkImageExists(url);
      if (!exists) break;
      count = i;
    }
    return count;
  }

  async function init() {
    let childName = childId;
    try {
      const docSnap = await getDoc(doc(db, "children", childId));
      if (docSnap.exists()) childName = docSnap.data().name;
    } catch (e) {}

    document.getElementById('bookTitle').textContent = childName + " - 제 " + Number(bookId) + "권";
    document.getElementById('backLink').href = "shelf.html?child=" + childId;

    const TOTAL_PAGES = await detectTotalPages(IMAGE_FOLDER);

    if (TOTAL_PAGES === 0) {
      document.getElementById('loadingMsg').textContent = '이미지를 찾을 수 없습니다. 경로를 확인해주세요.';
      return;
    }

    const pageImages = [];
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      pageImages.push(IMAGE_FOLDER + "/pages (" + i + ").jpg");
    }

    const SPREAD_RATIO = 1040 / 735;
    const wrap = document.querySelector('.flip-wrap');
    const viewport = document.getElementById('flipViewport');
    const stage = document.getElementById('flipStage');

    function computeStageSize() {
      const wrapH = wrap.clientHeight;
      const wrapW = wrap.clientWidth;
      let h = wrapH;
      let w = h * SPREAD_RATIO;
      if (w > wrapW) { w = wrapW; h = w / SPREAD_RATIO; }
      stage.style.width = w + 'px';
      stage.style.height = h + 'px';
      return { w, h };
    }

    let stageSize = computeStageSize();
    let stageW = stageSize.w;
    let stageH = stageSize.h;
    viewport.style.height = stageH + 'px';

    // ===== 수정: 변수명 pageFlip 정상 복구 =====
    const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
      width: 520,
      height: 735,
      size: 'stretch',
      minWidth: 260, maxWidth: 1600,
      minHeight: 368, maxHeight: 2200,
      showCover: true,
      usePortrait: true,
      maxShadowOpacity: 0.5,
      startPage: 0
    });

    pageFlip.loadFromImages(pageImages);
    document.getElementById('loadingMsg').style.display = 'none';

    const slider = document.getElementById('pageSlider');
    slider.max = TOTAL_PAGES;

    function getSingleMode(currentIndex) {
      if (currentIndex === 0) return 'cover';
      const remainingAfterCover = TOTAL_PAGES - 1;
      const isLastAlone = (currentIndex === TOTAL_PAGES - 1) && (remainingAfterCover % 2 === 1);
      if (isLastAlone) return 'last';
      return null;
    }

    function updateViewport() {
      const current = pageFlip.getCurrentPageIndex();
      const mode = getSingleMode(current);
      if (mode === 'cover') {
        viewport.style.width = (stageW / 2) + 'px';
        stage.style.left = (-stageW / 2) + 'px';
      } else if (mode === 'last') {
        viewport.style.width = (stageW / 2) + 'px';
        stage.style.left = '0px';
      } else {
        viewport.style.width = stageW + 'px';
        stage.style.left = '0px';
      }
    }

    function updateIndicator() {
      const current = pageFlip.getCurrentPageIndex();
      const mode = getSingleMode(current);
      let label;
      if (mode === 'cover') {
        label = "1";
      } else if (mode === 'last') {
        label = String(TOTAL_PAGES);
      } else {
        const left = current + 1;
        const right = current + 2;
        label = left + "-" + right;
      }
      document.getElementById('pageIndicator').textContent = label + " / " + TOTAL_PAGES;
      slider.value = current + 1;
    }

    pageFlip.on('flip', () => {
      console.log('현재 인덱스:', pageFlip.getCurrentPageIndex(), '전체 페이지:', TOTAL_PAGES);
      updateIndicator();
      updateViewport();
    });

    updateIndicator();
    updateViewport();

    window.addEventListener('resize', () => {
      const size = computeStageSize();
      stageW = size.w; stageH = size.h;
      viewport.style.height = stageH + 'px';
      updateViewport();
    });

    document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());
    slider.addEventListener('input', () => pageFlip.flip(Number(slider.value) - 1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') pageFlip.flipNext();
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
    });

    const bgm = document.getElementById('bgmPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    bgm.src = BGM_PATH;
    document.getElementById('musicTitle').textContent = "제 " + Number(bookId) + "권 배경음악";
    playPauseBtn.addEventListener('click', () => {
      if (bgm.paused) { bgm.play().catch(() => {}); playPauseBtn.textContent = '⏸'; }
      else { bgm.pause(); playPauseBtn.textContent = '▶'; }
    });
  }
</script>
